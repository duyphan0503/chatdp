name: frontend
description: "ChatDP Frontend Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.0.0

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  fpdart: ^1.2.0
  http_parser: ^4.0.0

  # DI
  get_it: ^9.2.0
  injectable: ^2.5.0

  # UI & Assets
  # Social Login
  google_sign_in_all_platforms: ^2.0.2
  google_fonts: ^6.2.1
  lottie: ^3.3.0
  cached_network_image: ^3.4.1

  # Data Class / Code Gen support
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pinput: ^6.0.1
  flutter_dotenv: ^6.0.0
  bloc_concurrency: ^0.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  emoji_picker_flutter: ^4.4.0
  image_picker: ^1.2.1
  mime: ^2.0.0
  stream_transform: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^3.2.3
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.2
  flutter_gen_runner: ^5.12.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/logo.png
    - assets/logo_transparent.png
    - .env

flutter_gen:
  output: lib/gen/
