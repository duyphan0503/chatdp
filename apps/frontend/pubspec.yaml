name: frontend
description: "ChatDP Frontend Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.6.0

  # Networking
  dio: ^5.7.0

  # DI
  get_it: ^8.0.0
  injectable: ^2.5.0

  # UI & Assets
  google_fonts: ^6.2.1
  lottie: ^3.3.0
  cached_network_image: ^3.4.1

  # Data Class / Code Gen support
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  injectable_generator: ^2.6.2
  json_serializable: ^6.9.0
  
  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/logo.png
    - assets/logo_transparent.png
